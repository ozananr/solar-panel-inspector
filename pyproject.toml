[project]
name = "solar-panel-inspector"
version = "0.1.0"
description = "End-to-end computer vision system for detecting defective solar cells in electroluminescence images"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E, W: PEP 8 stil hatalari
# F: kullanilmayan import, tanimsiz degisken gibi hatalar
# I: import siralamasi
# B: yaygin bug kaliplari
# UP: eski Python yazim sekillerini modernlestirme
# N: isimlendirme kurallari
# S: guvenlik kontrolleri
# SIM: gereksiz karmasik kodu sadelestirme
# RUF: Ruff'a ozel ek kurallar
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Testlerde assert kullanmak normaldir, guvenlik kuralindan muaf tut
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true

